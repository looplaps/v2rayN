name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config --global user.name "looplaps"
          git config --global user.email "87746958+looplaps@users.noreply.github.com"
          git remote add upstream https://github.com/2dust/v2rayN.git || git remote set-url upstream https://github.com/2dust/v2rayN.git
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit || true
          git push origin master
